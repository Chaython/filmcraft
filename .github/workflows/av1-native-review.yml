name: Native AV1 review (standalone crate)

on:
  push:
    branches: [av1-native-rust-review]
  pull_request:
    paths:
      - "crates/av1enc/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/av1-native-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  av1-native:
    name: Pure Rust AV1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Native AV1 compile
        run: cargo check -p filmcraft-av1enc --all-targets
      - name: Install independent AV1 decoder oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -decoders | grep -F libdav1d
      - name: Native AV1 tests with mandatory independent decoder
        env:
          FILMCRAFT_REQUIRE_AV1_ORACLE: "1"
        run: cargo test -p filmcraft-av1enc -- --nocapture
      - name: Strict lint
        run: cargo clippy -p filmcraft-av1enc --all-targets -- -D warnings
