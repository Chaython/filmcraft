name: NVENC advanced rate control

on:
  push:
    branches: [nvenc-av1-advanced-rate-control]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rate-control:
    name: NVENC rate control (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libdbus-1-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check affected crates and desktop app
        run: cargo check -p filmcraft-platform -p filmcraft-export -p filmcraft-ui-egui -p filmcraft --all-targets
      - name: Validate CQP settings and codec-specific QP ranges
        run: cargo test -p filmcraft-export --lib cqp
      - name: Validate NVENC AV1 QP and rate-control configuration
        run: cargo test -p filmcraft-platform --lib cqp
      - name: Validate translated rate-control UI
        run: cargo test -p filmcraft-ui-egui --lib i18n
      - name: Strict lint
        run: cargo clippy -p filmcraft-platform -p filmcraft-export -p filmcraft-ui-egui -p filmcraft --all-targets -- -D warnings
