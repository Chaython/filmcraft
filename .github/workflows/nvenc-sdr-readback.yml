name: NVENC SDR GPU readback integration

on:
  push:
    branches: [nvenc-av1-sdr-gpu-readback]
  pull_request:
    branches: [main]
    paths:
      - "crates/gpu/**"
      - "crates/export/**"
      - "apps/filmcraft*/**"
      - "crates/ui-egui/examples/bench/sections.rs"
      - "Cargo.lock"
      - ".github/workflows/nvenc-sdr-readback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-sdr:
    name: SDR readback / HDR-safe fallback (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libdbus-1-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check GPU, export, desktop and CLI
        run: cargo check -p filmcraft-gpu -p filmcraft-export -p filmcraft-cli -p filmcraft --all-targets
      # Hosted Windows runners fail the baseline FX compute-shader tests with the same FXC
      # error as main; keep runtime parity on Linux and use Windows for compile/lint validation.
      # Serialize GPU tests to avoid overloading the software adapter with concurrent pipelines.
      - name: GPU export-renderer parity tests
        if: runner.os == 'Linux'
        run: cargo test -p filmcraft-gpu --lib export_renderer::tests -- --test-threads=1
      - name: GPU / CPU export parity tests
        if: runner.os == 'Linux'
        run: cargo test -p filmcraft-gpu --test export_pipeline -- --test-threads=1
      - name: Export pipeline unit tests
        run: cargo test -p filmcraft-export --lib -- --test-threads=1
      - name: Strict lint
        run: cargo clippy -p filmcraft-gpu -p filmcraft-export -p filmcraft-cli -p filmcraft --all-targets -- -D warnings
